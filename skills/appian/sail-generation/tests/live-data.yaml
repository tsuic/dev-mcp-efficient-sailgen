# =============================================================================
# SAIL Generation Test Suite — Live Data Test Cases
# =============================================================================
#
# Each test case exercises the SAIL generation pipeline against REAL Appian
# record types, fields, and relationships on a live instance. Unlike mockup
# tests (which use hardcoded sample data), these validate that the pipeline
# can discover schemas via MCP tools and produce SAIL referencing real UUIDs.
#
# Fields:
#   id:          Unique test identifier
#   type:        Expected pipeline classification
#   app:         Appian application name (looked up at runtime)
#   prompt:      The natural-language user request (what gets sent to the agent)
#   covers:      Components/features this test exercises (for coverage tracking)
#
# Naming convention:
#   Prompts contain a literal interface name prefixed with TEST_LIVE_ (e.g.
#   TEST_LIVE_ITSM_Team_Dashboard). At runtime the script appends a unique
#   suffix via regex (same approach as run_mockups.py with TEST_ prefix).
#
# Prerequisites:
#   - The target Appian instance must have the referenced application deployed
#   - Record types must have data populated (tests query live records)
#   - The agent must have MCP connectivity to the instance
#
# =============================================================================

# -----------------------------------------------------------------------------
# DASHBOARD tests — live data from real record types
# -----------------------------------------------------------------------------

- id: live-dashboard-01-itsm-team
  type: dashboard
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Team_Dashboard — an ITSM team dashboard with the
    following contents:

    1. KPI row (4 tiles):
       - Open tickets count (status New/In Progress/On Hold)
       - Unassigned tickets count (no assignee, open)
       - Critical/High priority tickets count (open)
       - Resolved this week count (resolvedAt in last 7 days)

    2. Aging list grid: open tickets older than 5 days, oldest first —
       title, status, priority, days open, assignee

    3. Breakdown chart: open ticket count by category (or priority)

    4. My Queue: open tickets assigned to the logged-in user
  covers:
    - live dashboard (live variant agent)
    - KPI tiles with record-type queries
    - filtered record counts (status, priority, assignee)
    - date arithmetic (days open, resolved this week)
    - a!queryRecordType with filters
    - a!gridField backed by record data
    - chart from aggregated record data
    - loggedInUser() for personalized section
    - real UUID references (record type, fields, relationships)

# -----------------------------------------------------------------------------
# RECORD-VIEW tests — live data from real record types
# -----------------------------------------------------------------------------

- id: live-record-view-01-itsm-ticket-summary
  type: record-view
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Ticket_Summary — a record summary view for the
    ITSM Ticket record type. Use the record's id field as the identifier.
    The page title should display the ticket's title.

    Key attributes (displayed prominently at the top):
      - Status display name
      - Priority display name
      - Category display name

    Section "Ticket Details":
      - Title
      - Description
      - Category display name
      - Created date
      - Resolved date

    Section "Assignment & Ownership":
      - Assigned To
      - Created By
      - Modified By
  covers:
    - live record-view (live variant agent)
    - key attributes as plain text (no tags)
    - related record display name queries (status, priority, category via relationships)
    - many-to-one relationship field lookups in dataBinding
    - multiple sections with label/value pairs
    - dynamic page title from record field (title)
    - date fields (createdAt, resolvedAt)
    - user fields (assignedTo, createdBy, modifiedBy)
    - real UUID references (record type, fields, relationships)
    - plain fieldRef on key attributes and sections

# -----------------------------------------------------------------------------
# FORM tests — live data forms that bind to ri!record[...] for create/edit
# -----------------------------------------------------------------------------

- id: live-form-01-itsm-ticket-create
  type: form
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Create_Ticket — a create/edit form for the
    ITSM Ticket record type. The form should support both creating new
    tickets and editing existing ones (driven by ri!isUpdate).

    Section "Ticket Details":
      - Title (required, text)
      - Description (paragraph, full width)

    Section "Classification":
      - Status (dropdown from ITSM Status lookup table — show labels, save IDs)
      - Priority (dropdown from ITSM Priority lookup table — show labels, save IDs)
      - Category (dropdown from ITSM Category lookup table — show labels, save IDs)

    Section "Assignment":
      - Assigned To (user picker)

    The form should use ri!record typed to ITSM Ticket, with ri!isUpdate
    and ri!cancel as rule inputs. Dropdown fields should query their
    respective lookup tables via a!queryRecordType() instead of hardcoding choices.
  covers:
    - live form (live variant agent)
    - ri!record[recordType!...fields...] value/saveInto binding
    - ri!isUpdate for conditional title and button label
    - ri!cancel for cancel button
    - lookup query prologues (a!queryRecordType for Status, Priority, Category)
    - dropdown fields bound to lookup data (choiceLabels/choiceValues from query)
    - user picker field
    - paragraph field (full width, single-field row)
    - multiple sections (Ticket Details, Classification, Assignment)
    - required field validation
    - real UUID references (ITSM Ticket fields, Status/Priority/Category record types)
    - createInterface with inputs [record, isUpdate, cancel]

# -----------------------------------------------------------------------------
# WIZARD tests — live data wizards with multi-step ri!record binding
# -----------------------------------------------------------------------------

- id: live-wizard-01-itsm-ticket-submit
  type: wizard
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Submit_Ticket — a multi-step wizard for employees to
    submit a new IT support ticket. The wizard should use ri!record typed
    to ITSM Ticket with ri!isUpdate and ri!cancel rule inputs.

    Step 1 "Describe Issue":
      - Title (required, text)
      - Description (paragraph, full width)
      - Category (required, dropdown from ITSM Category lookup — show labels, save IDs)

    Step 2 "Priority & Assignment":
      - Priority (required, dropdown from ITSM Priority lookup — show labels, save IDs)
      - Assigned To (user picker — the IT agent to route this to)

    Step 3 "Review & Submit":
      - Auto-generated review summary showing all entered fields

    Dropdown fields should query their respective lookup tables via
    a!queryRecordType() instead of hardcoding choices. The wizard should
    disable the Next button on each step when required fields are empty
    (using the ri!record field paths).
  covers:
    - live wizard (live variant agent)
    - ri!record[recordType!...fields...] value/saveInto binding across steps
    - ri!isUpdate for conditional title and button label
    - ri!cancel for cancel button
    - lookup query prologues (a!queryRecordType for Category, Priority)
    - dropdown fields bound to lookup data across different wizard steps
    - user picker field
    - paragraph field (full width)
    - disableNextButton derived from ri!record[...] required fields
    - auto-generated review step showing ri!record values
    - multiple steps with distinct field groupings
    - real UUID references (ITSM Ticket fields, Category/Priority record types)
    - createInterface with inputs [record, isUpdate, cancel]


# -----------------------------------------------------------------------------
# GRID tests — live data with export and record actions
# -----------------------------------------------------------------------------

- id: live-grid-01-itsm-ticket-list
  type: grid
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Ticket_List — a records-powered grid showing ITSM Tickets
    with the following features:

    Columns:
      - Title (primary column — clickable link to the record)
      - Status (display name from the status relationship, shown as tag)
      - Priority (display name from the priority relationship, shown as tag)
      - Category (display name from the category relationship)
      - Assigned To
      - Created At

    Grid-level features:
      - Enable the built-in "Export to Excel" button (showExportButton)
      - The "Assigned To" column should be EXCLUDED from the Excel export
        (use exportWhen: false on that column) since usernames are internal
      - Add the "New Ticket" record list action above the grid
        (recordType!ITSM Ticket.actions.createTicket — no identifier needed)
      - Add per-row actions for "Edit Ticket" and "Work on Ticket"
        (both are related actions requiring fv!identifier)
      - The grid should refresh after any record action completes

    The grid data source should be the ITSM Ticket record type directly.
    Tag colors for Status: New=ACCENT, In Progress=POSITIVE, On Hold=SECONDARY,
    Resolved=POSITIVE, Closed=SECONDARY.
    Tag colors for Priority: Critical=NEGATIVE, High=NEGATIVE, Medium=ACCENT,
    Low=SECONDARY.
  covers:
    - live grid backed by record type data source
    - showExportButton (built-in Excel export on records-powered grid)
    - exportWhen false on specific column (exclude from export)
    - recordActions on a!gridField for list action (New Ticket, no identifier)
    - per-row a!recordActionField for related actions (Edit, Work On — with fv!identifier)
    - refreshAfter RECORD_ACTION
    - tag columns with tagColors for status and priority
    - relationship display names (status, priority, category via many-to-one)
    - a!recordLink on primary column
    - real UUID references (ITSM Ticket record type, fields, relationships, actions)

# -----------------------------------------------------------------------------
# LAYOUT tests — process-launching links and action buttons
# -----------------------------------------------------------------------------

- id: live-layout-01-itsm-ticket-actions
  type: record-view
  app: IT Service Management
  prompt: >
    In the "IT Service Management" app, create an interface called
    TEST_LIVE_ITSM_Ticket_Actions_View — a record summary view for
    ITSM Ticket that prominently features process-launching actions.
    Use the record's id field as the identifier.

    Key attributes (top):
      - Status display name (tag with colors: New=ACCENT, In Progress=POSITIVE,
        On Hold=SECONDARY, Resolved=POSITIVE, Closed=SECONDARY)
      - Priority display name (tag with colors: Critical=NEGATIVE, High=NEGATIVE,
        Medium=ACCENT, Low=SECONDARY)
      - Assigned To

    Section "Ticket Details":
      - Title
      - Description
      - Category display name
      - Created At

    After the sections, include a layout block with these elements stacked
    vertically (NOT side-by-side — each on its own row):
      1. An a!recordActionField displaying the "Edit Ticket" and "Work on Ticket"
         related actions in TOOLBAR style for this specific record (using rv!identifier)
      2. A button labeled "Escalate to Manager" that launches an unattended process
         (use a!startProcess with cons!ITSM_ESCALATE_PM and pass the ticket ID as
         a parameter named "ticketId" with value rv!identifier)
      3. A link field with a process link labeled "Transfer Ownership" that uses
         a!startProcessLink to launch cons!ITSM_TRANSFER_PM with processParameters
         ticketId: rv!identifier, and bannerMessage "Ownership transferred successfully"
  covers:
    - live record-view (live variant agent)
    - recordActionField leaf with actionRef and identifier (Edit Ticket, Work on Ticket)
    - button leaf with action.type startProcess (unattended Escalate)
    - linkField leaf with linkType startProcess (attended Transfer via a!startProcessLink)
    - processModel constant references (cons!ITSM_ESCALATE_PM, cons!ITSM_TRANSFER_PM)
    - processParameters passing record identifier
    - bannerMessage on startProcessLink
    - tag-type key attributes (status, priority with color maps)
    - relationship display name fields (status, priority, category)
    - layout-tree after sections (recordActionField + button + linkField)
    - real UUID references (ITSM Ticket, actions, fields, relationships)
