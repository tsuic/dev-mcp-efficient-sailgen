# -----------------------------------------------------------------------------
# LAYOUT tests — recursive container/leaf tree structures
# -----------------------------------------------------------------------------

- id: layout-01-team-directory-cards
  type: layout
  prompt: >
    Create a standalone interface called TEST_TeamDirectory.
    A team directory page with a HERO header (title "Our Team", subtitle "Meet
    the people behind the product"). Body is a cardGroup of 6 imageCard leaves,
    each representing a team member with a placeholder photo URL
    (https://i.pravatar.cc/300?img=N for N=1-6), their name as heading, role as
    text, and a "View Profile" link.
  covers:
    - layout type with HERO headerKind
    - cardGroup container
    - imageCard leaf (×6)
    - link on imageCard

- id: layout-02-notification-center
  type: layout
  prompt: >
    Create a standalone interface called TEST_NotificationCenter.
    A notification center page (no header, bare fragment). Use tabs container
    with 3 tabs: "All", "Unread", "Mentions". Inside each tab, an itemList
    leaf showing notification items. The "All" tab has 5 items with text avatar
    type and trailing tag (types: Info=ACCENT, Warning=SECONDARY, Alert=NEGATIVE,
    Success=POSITIVE, Info=ACCENT). "Unread" tab has 3 items, "Mentions" tab
    has 2 items. Each notification has a person's initials, title (the person's
    name), and text (the notification message).
  covers:
    - layout with tabs container
    - itemList leaf with text avatars
    - trailingType "tag"
    - multiple tabs with different item counts

- id: layout-03-pricing-page
  type: layout
  prompt: >
    Create a standalone interface called TEST_PricingPage.
    A SaaS pricing page. PLAIN_CARD header with title "Choose Your Plan" and
    subtitle "Start free, upgrade anytime". Body: columns container with 3
    items, each a "card" container (styles: STANDARD, ACCENT, STANDARD) holding
    a vertical stack — a heading leaf (plan name: Starter/Professional/
    Enterprise), a keyValueList leaf (Features: 5 items each like "Users: Up to
    5", "Storage: 10GB", "Support: Email", "API calls: 1K/mo", "Integrations:
    3"), and a richTextBlock leaf with the price ("$0/mo", "$49/mo", "Custom").
  covers:
    - layout with columns + nested card containers
    - card style variants (STANDARD, ACCENT)
    - heading leaf
    - keyValueList leaf
    - richTextBlock leaf
    - 3-column pricing pattern

- id: layout-04-activity-feed
  type: layout
  prompt: >
    Create a standalone interface called TEST_ActivityFeed.
    An activity feed page (no header). Root is a columns container with 2 items:
    left column (width "WIDE_PLUS") has an itemList leaf with 6 activity items
    using icon avatars (use "circle" placeholders), text trailing type showing
    timestamps like "2 hours ago", "Yesterday", etc. Each item is an activity
    description (e.g., "Completed code review for PR #342"). Right column
    (width "MEDIUM") has a card container holding a keyValueList leaf "Quick
    Stats" with items: Today's Activity (12), This Week (47), Pending Reviews
    (3), Team Members Online (8).
  covers:
    - layout with columns (explicit widths)
    - itemList with icon avatars
    - trailingType "text"
    - card container with keyValueList
    - two-column asymmetric layout

- id: layout-05-status-board
  type: layout
  prompt: >
    Create a standalone interface called TEST_StatusBoard.
    A service status board. PLAIN_CARD header titled "System Status", subtitle
    "All systems operational". Body: first a banner leaf (severity: SUCCESS,
    text "All services are running normally", heading "Operational"), then a
    sideBySide container with a stamp leaf (icon "circle", color "#27ae60",
    width MINIMIZE) and a heading leaf (text "Core Services", size MEDIUM).
    Then a tagGroup leaf with items: API (color POSITIVE), Web App (POSITIVE),
    Database (POSITIVE), CDN (POSITIVE), Auth Service (POSITIVE). Then another
    sideBySide + heading for "Recent Incidents" and an itemList leaf showing
    3 past incidents with text avatars and tag trailing (Resolved=POSITIVE,
    Investigating=SECONDARY, Resolved=POSITIVE).
  covers:
    - banner leaf (SUCCESS severity)
    - stamp leaf in sideBySide (MINIMIZE width)
    - heading leaf
    - tagGroup leaf
    - itemList with tag trailing
    - multiple sequential layout sections

- id: layout-06-onboarding-welcome
  type: layout
  prompt: >
    Create a standalone interface called TEST_OnboardingWelcome.
    A new user welcome page. BILLBOARD header with image
    "https://images.unsplash.com/photo-1497366216548-37526070297c",
    title "Welcome to Acme Platform", subtitle "Let's get you set up in
    3 easy steps". Body: a columns container with 3 equal-width items, each
    is a card container (all STANDARD style) with a stamp leaf (icon "circle",
