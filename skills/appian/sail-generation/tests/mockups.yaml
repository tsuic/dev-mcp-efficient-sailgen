# =============================================================================
# SAIL Generation Test Suite — Mockup Test Cases
# =============================================================================
#
# Each test case is a user prompt that should be dispatched through the full
# SAIL generation pipeline. The interface name (TEST_*) tells the pipeline to
# create a standalone interface object with no app association.
#
# Fields:
#   id:          Unique test identifier
#   type:        Expected pipeline classification
#   prompt:      The natural-language user request (what gets sent to the agent)
#   covers:      Components/features this test exercises (for coverage tracking)
#
# =============================================================================

# -----------------------------------------------------------------------------
# FORM tests — data entry interfaces
# -----------------------------------------------------------------------------

- id: form-01-employee-onboarding
  type: form
  prompt: >
    Create a standalone interface called TEST_EmployeeOnboarding.
    Build an employee onboarding form with sections for Personal Information
    (first name, middle initial, last name in a row, then email and phone in a
    row, then date of birth), Employment Details (department dropdown with
    Engineering/Sales/Marketing/HR/Finance, role title, start date, salary as a
    decimal), and Preferences (remote work toggle, preferred office location
    dropdown with NYC/SF/London/Berlin, dietary restrictions checkboxes with
    Vegetarian/Vegan/Gluten-Free/Halal/Kosher/None).
  covers:
    - form sections
    - multi-field rows with width weighting
    - text, email, phone, date, dropdown, decimal, toggle, checkbox
    - required fields

- id: form-02-incident-report
  type: form
  prompt: >
    Create a standalone interface called TEST_IncidentReport.
    Build a security incident report form. First section "Incident Details":
    incident title (text, full width), severity (radio buttons: Critical/High/
    Medium/Low), date and time of incident (datetime), location (text). Second
    section "Description": detailed description (paragraph field), immediate
    actions taken (paragraph). Third section "Affected Systems": system name
    (text) and system owner (user picker) in a row, data classification
    (dropdown: Public/Internal/Confidential/Restricted), data breach confirmed
    (boolean checkbox). Fourth section "Attachments": evidence upload (file
    upload field).
  covers:
    - form with 4 sections
    - paragraph, datetime, radio, boolean, fileupload, userpicker
    - single-field rows and multi-field rows

- id: form-03-purchase-request
  type: form
  prompt: >
    Create a standalone interface called TEST_PurchaseRequest.
    A purchase request form with: Requestor Info section (requestor name text,
    department dropdown with 8 departments, cost center number field), Item
    Details section (item description text, quantity as integer, unit price as
    decimal, vendor name text, vendor contact email), Justification section
    (business justification paragraph, urgency radio with Routine/Urgent/
    Emergency), Approval section (approving manager user picker, budget owner
    group picker, requires VP approval toggle).
  covers:
    - number (integer), decimal, email, grouppicker
    - toggle, radio, paragraph, dropdown
    - mixed row layouts

- id: form-04-patient-intake
  type: form
  prompt: >
    Create a standalone interface called TEST_PatientIntake.
    A healthcare patient intake form. Demographics section: full name (text),
    date of birth (date field), sex (radio: Male/Female/Other), SSN (encrypted
    text field). Contact section: phone and email side by side, street address
    full width, city and state and zip in a 3:1:1 weighted row. Insurance
    section: provider (dropdown: Aetna/BlueCross/Cigna/UnitedHealth/Kaiser/
    Other), policy number (text), group number (text) in a row. Medical History
    section: known allergies (paragraph), current medications (paragraph),
    primary care physician (text).
  covers:
    - encrypted field
    - date field
    - 3-field row with width weighting (3:1:1)
    - paragraphs for long text
    - radio with 3 options

- id: form-05-event-registration
  type: form
  prompt: >
    Create a standalone interface called TEST_EventRegistration.
    An event registration form. Attendee Info: full name (text), email, company
    (text) in a row. Event Preferences: session track (card choice field with
    tiles for Technical/Business/Design/Leadership, single select), dietary
    preference (dropdown: None/Vegetarian/Vegan/Halal/Kosher/Gluten-Free),
    t-shirt size (radio: XS/S/M/L/XL/XXL). Accessibility: requires
    accessibility accommodations (boolean), accommodation details (paragraph),
    preferred communication method (radio: Email/Phone/Text). Agreement:
    agree to code of conduct (boolean, required), subscribe to newsletter
    (toggle).
  covers:
    - cardchoice with TILE template
    - boolean vs toggle distinction
    - conditional-feel layout (accessibility details)
    - required boolean (agreement)

- id: form-06-high-contrast-intake
  type: form
  prompt: >
    Create a standalone interface called TEST_HighContrastIntake.
    A high-contrast accessibility-friendly intake form. Use a very dark
    header (#000000), pure white page background (#FFFFFF), light gray cards
    (#F8F8F8), black title text on the header would not work so use bright
    yellow (#FFDD00), and white subtitle (#FFFFFF). Two sections: "Contact
    Details" with full name (text, required), email (required), phone in a
    row; "Request" with category (dropdown: General Inquiry/Bug Report/
    Feature Request/Billing/Other), priority (radio: Low/Normal/High/
    Urgent), description (paragraph, required).
  covers:
    - high-contrast theme on form
    - theme.headerBg #000000, titleColor #FFDD00
    - accessibility-motivated color choices
    - validates extreme color values pass hex validation
    - simple 2-section form with required fields

# -----------------------------------------------------------------------------
# WIZARD tests — multi-step sequential processes
# -----------------------------------------------------------------------------

- id: wizard-01-new-hire-setup
  type: wizard
  prompt: >
    Create a standalone interface called TEST_NewHireSetup.
    Build a 4-step new hire setup wizard. Step 1 "Personal Details": first name
    and last name in a row, email, phone number, date of birth. Step 2
    "Job Configuration": department (dropdown with 6 departments), job title,
    manager (user picker), start date, employment type (radio: Full-Time/
    Part-Time/Contract). Step 3 "IT Setup": laptop preference (card choice:
    MacBook Pro/ThinkPad/Surface Pro, single select), needs VPN access
    (toggle), additional software (checkboxes: Slack/Zoom/Figma/Jira/Tableau).
    Step 4 "Review & Confirm": office location (dropdown: NYC/SF/London/
    Austin), parking pass needed (boolean), any notes (paragraph).
  covers:
    - 4-step wizard
    - cardchoice, toggle, checkbox, userpicker, date
    - dropdown, radio, paragraph
    - multi-field rows

- id: wizard-02-expense-submission
  type: wizard
  prompt: >
    Create a standalone interface called TEST_ExpenseSubmission.
    A 3-step expense report wizard. Step 1 "Trip Details": trip name (text),
    destination (text), departure date and return date in a row (both date
    fields), business purpose (paragraph). Step 2 "Expenses": expense category
    (dropdown: Airfare/Hotel/Meals/Ground Transport/Conference Fee/Other),
    amount (decimal), currency (radio: USD/EUR/GBP/JPY), merchant name (text),
    receipt (file upload). Step 3 "Submission": cost center (number), approving
    manager (user picker), urgency (radio: Standard/Rush), additional comments
    (paragraph).
  covers:
    - 3-step wizard
    - date fields side by side
    - decimal, fileupload, number
    - dropdown, radio, userpicker

- id: wizard-03-vendor-qualification
  type: wizard
  prompt: >
    Create a standalone interface called TEST_VendorQualification.
    A 5-step vendor qualification wizard. Step 1 "Company Profile": company
    name and DBA in a row, tax ID (text), country (dropdown with 10 countries),
    website URL (text). Step 2 "Contact Information": primary contact name and
    title in a row, email and phone in a row, secondary contact name (text),
    secondary contact email. Step 3 "Capabilities": service categories
    (checkboxes: IT Services/Consulting/Manufacturing/Logistics/Marketing/
    Legal/Facilities), years in business (number), annual revenue (decimal),
    number of employees (number). Step 4 "Compliance": ISO certified (boolean),
    SOC 2 compliant (boolean), GDPR compliant (boolean), insurance provider
    (text), policy number (text). Step 5 "Documentation": company description
    (paragraph), upload certifications (file upload), upload insurance docs
    (file upload).
  covers:
    - 5-step wizard (max common steps)
    - multiple boolean fields
    - multiple file uploads
    - checkboxes with many options
    - number and decimal in same step

- id: wizard-04-branded-onboarding
  type: wizard
  prompt: >
    Create a standalone interface called TEST_BrandedOnboarding.
    A 3-step customer onboarding wizard with a warm brand palette — use a
    deep indigo header (#312E81), soft lavender page background (#EDE9FE),
    white cards, cream-toned title text (#F5F3FF), and muted purple subtitle
    (#A78BFA). Step 1 "Account Setup": company name (text), industry
    (dropdown: Technology/Healthcare/Finance/Retail/Manufacturing/Other),
    company size (radio: 1-10/11-50/51-200/201-1000/1000+). Step 2
    "Primary Contact": full name (text), email, phone in a row, job title
    (text). Step 3 "Preferences": preferred timezone (dropdown with 5
    timezones), communication preference (radio: Email/Slack/Teams),
    onboarding goals (paragraph).
  covers:
    - custom brand theme on wizard
    - theme.headerBg, pageBg, titleColor, subtitleColor overrides
    - 3-step wizard
    - dropdown, radio, paragraph
    - validates non-default structural colors in form layout

# -----------------------------------------------------------------------------
# GRID tests — record list / table views
# -----------------------------------------------------------------------------

- id: grid-01-order-management
  type: grid
  prompt: >
    Create a standalone interface called TEST_OrderManagement.
    Build an order management grid with columns: Order ID (primary, NARROW_PLUS),
    Customer (text, MEDIUM), Order Date (text, MEDIUM), Total (text, NARROW_PLUS,
    right-aligned), Status (tag, NARROW_PLUS, with colors: Pending=SECONDARY,
    Processing=ACCENT, Shipped=ACCENT, Delivered=POSITIVE, Cancelled=NEGATIVE).
    Include 6 sample rows with realistic order data. Add a Status filter.
    Primary action button labeled "New Order".
  covers:
    - grid with tag column
    - tagColors mapping (5 statuses)
    - right-aligned column
    - filter derived from tag column
    - primaryActionLabel
    - PLAIN_CARD header (default)

- id: grid-02-employee-directory
  type: grid
  prompt: >
    Create a standalone interface called TEST_EmployeeDirectory.
    An employee directory grid. Columns: Name (primary, MEDIUM), Department
    (text, MEDIUM), Title (text, MEDIUM_PLUS), Location (text, NARROW_PLUS),
    Status (tag, NARROW, colors: Active=POSITIVE, On Leave=SECONDARY,
    Terminated=NEGATIVE). 8 sample rows spanning all statuses. Filters for
    Department (choices: Engineering/Sales/Marketing/HR/Finance/Operations)
    and Status. Hero-style header with subtitle "Find and connect with
    colleagues across the organization".
  covers:
    - grid with HERO headerKind
    - multiple filters
    - many sample rows
    - primary column (linked name)

- id: grid-03-project-tracker
  type: grid
  prompt: >
    Create a standalone interface called TEST_ProjectTracker.
    A project portfolio grid with columns: Project Name (primary, MEDIUM_PLUS),
    Owner (text, NARROW_PLUS), Priority (tag, NARROW, colors: Critical=NEGATIVE,
    High=ACCENT, Medium=SECONDARY, Low=POSITIVE), Progress (progressBar,
    NARROW_PLUS), Due Date (text, NARROW_PLUS), Budget (text, NARROW_PLUS,
    right-aligned). 5 sample rows. Filter for Priority. No header (headerKind
    NONE).
  covers:
    - progressBar column type
    - headerKind NONE
    - tag + progressBar in same grid
    - right-aligned budget column
    - filter on tag column

- id: grid-04-asset-inventory
  type: grid
  prompt: >
    Create a standalone interface called TEST_AssetInventory.
    An IT asset inventory grid. Columns: Asset Tag (primary, NARROW_PLUS),
    Device (text, MEDIUM), Assigned To (text, MEDIUM), Location (text,
    NARROW_PLUS), Condition (tag, NARROW_PLUS, colors: Excellent=POSITIVE,
    Good=ACCENT, Fair=SECONDARY, Poor=NEGATIVE, Retired=NEGATIVE), Actions
    (buttonArray, NARROW_PLUS). 6 rows of laptop/monitor/phone assets.
    Filter for Condition. Billboard header with a background image URL
    "https://images.unsplash.com/photo-1518770660439-4636190af475" and
    subtitle "Track and manage all company hardware assets".
  covers:
    - buttonArray column type
    - headerKind BILLBOARD with image
    - 5-value tag column
    - filter on tag

- id: grid-05-midnight-security-log
  type: grid
  prompt: >
    Create a standalone interface called TEST_SecurityLog.
    A security event log grid with a dark "midnight ops" color scheme — use
    charcoal header (#1F2937), slate page background (#111827), dark gray
    cards (#1F2937), light gray title text (#F9FAFB), and muted blue-gray
    subtitle (#9CA3AF). Columns: Timestamp (primary, MEDIUM), Event (text,
    MEDIUM_PLUS), Source IP (text, NARROW_PLUS), Severity (tag, NARROW,
    colors: Critical=#EF4444, High=#F59E0B, Medium=#3B82F6, Low=#6B7280),
    Action (text, NARROW_PLUS). 5 sample rows of auth failures and firewall
    blocks. Filter for Severity. PLAIN_CARD header with subtitle "Real-time
    security event stream".
  covers:
    - custom dark theme on grid
    - theme.headerBg, pageBg, cardBg, titleColor, subtitleColor overrides
    - hex colors in tagColors (not just keywords)
    - security/ops domain
    - validates dark cards render correctly in grid template

# -----------------------------------------------------------------------------
# DASHBOARD tests — KPIs, charts, metrics overview
# -----------------------------------------------------------------------------

- id: dashboard-01-sales-overview
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_SalesDashboard.
    A sales performance dashboard. Start with 4 KPI cards: Total Revenue
    ($2.4M, +12% vs last quarter, dollar-sign icon), Deals Closed (147,
    +8 this week, handshake-o icon), Avg Deal Size ($16.3K, up from $14.8K,
    line-chart icon), Win Rate (34%, +2pp vs last month, trophy icon). Then a
    column chart "Monthly Revenue" with months Jan-Jun and values showing
    growth. Then side-by-side: a pie chart "Revenue by Region" (North America
    55%, Europe 28%, Asia Pacific 17%) and a line chart "Pipeline Trend"
    showing 5 weeks of data. Finally an embedded grid "Top Deals" with columns:
    Deal (primary), Company (text), Value (text, right-aligned), Stage (tag
    with Negotiation=ACCENT, Proposal=SECONDARY, Closed Won=POSITIVE).
  covers:
    - dashboard with kpis + chart + columns + grid
    - 4 KPI cards with icons and sub text
    - column chart, pie chart, line chart
    - side-by-side charts in columns section
    - embedded grid with tag column

- id: dashboard-02-hr-analytics
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_HRAnalytics.
    An HR analytics dashboard. KPIs: Headcount (1,247, +32 this quarter,
    users icon), Open Positions (43, 12 urgent, briefcase icon), Avg Tenure
    (3.2 years, up from 2.8, calendar icon), Turnover Rate (8.4%, down
    from 11.2%, chart-line icon). Then a bar chart "Headcount by Department"
    with 6 departments. Then columns layout: an area chart "Monthly Attrition"
    (6 months of data) and a pie chart "Diversity Breakdown" (4 categories).
    No embedded grid. Header subtitle: "Workforce insights at a glance".
  covers:
    - dashboard without embedded grid
    - bar chart and area chart types
    - 4 KPIs
    - columns with area + pie

- id: dashboard-03-devops-monitoring
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_DevOpsDashboard.
    A DevOps monitoring dashboard. KPIs: Uptime (99.97%, SLA target 99.9%,
    server icon), Deployments (23, this week, rocket icon), Incidents (3,
    2 resolved, exclamation-triangle icon), Avg Deploy Time (4.2 min, down
    from 6.1, clock-o icon), Error Rate (0.03%, within threshold,
    bug icon), Active Alerts (7, 2 critical, bell icon). Then a line chart
    "Response Time (ms)" with hourly data over 8 hours showing a spike.
    Then side-by-side: a column chart "Deploys per Service" (5 services)
    and a pie chart "Incident Severity" (Critical/High/Medium/Low). Then a
    grid "Active Incidents" with columns: ID (primary), Service (text),
    Severity (tag: Critical=NEGATIVE, High=ACCENT, Medium=SECONDARY,
    Low=POSITIVE), Duration (text). 4 rows.
  covers:
    - 6 KPIs (max common count)
    - line chart with spike pattern
    - column + pie side by side
    - embedded incident grid
    - many icons

- id: dashboard-04-financial-summary
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_FinancialSummary.
    A quarterly financial summary dashboard using our corporate brand
    palette — navy header (#0C2340), very light blue-gray page background
    (#F0F4F8), white cards, gold KPI stamp colors cycling through #C99700
    #0C2340 #5B6770 #A4B0BD, and gold chart accent #C99700. KPIs: Revenue
    ($8.7M, +15% YoY, dollar-sign icon), EBITDA ($2.1M, 24% margin,
    line-chart icon), Cash Flow ($1.3M, positive trend, exchange icon),
    Burn Rate ($420K/mo, 18 months runway, fire icon). Column chart
    "Revenue vs Expenses" with Q1-Q4 and two series: Revenue and Expenses.
    Then columns: a line chart "Monthly Cash Position" (6 data points) and
    a bar chart "Department Spend" (5 departments). Hero header with
    subtitle "Q2 2024 Financial Performance".
  covers:
    - multi-series column chart
    - HERO headerKind on dashboard
    - line + bar side by side
    - financial domain
    - custom brand theme (corporate navy + gold)
    - theme.headerBg, pageBg, kpiColors, chartAccent overrides

# -----------------------------------------------------------------------------
# RECORD-VIEW tests — read-only record detail pages
