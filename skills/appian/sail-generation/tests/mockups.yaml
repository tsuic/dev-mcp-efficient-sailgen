- id: record-view-04-with-layout
  type: record-view
  prompt: >
    Create a standalone interface called TEST_ProjectDetail.
    A project detail record view for "Project Atlas". Key attributes: Status
    (Active, tag with Active=POSITIVE/On Hold=SECONDARY/Completed=ACCENT/
    Cancelled=NEGATIVE), Phase (Development), Priority (High), Start Date
    (2024-01-15). Section "Overview" with fields: description (paragraph),
    project manager, team size, budget. Section "Timeline" with fields:
    planned end date, actual progress, last milestone. Then a layout section
    with a columns container: left column has a chart leaf (pie chart "Budget
    Allocation" with Engineering 40%, Design 25%, QA 20%, PM 15%), right
    column has a kpis leaf (3 items: Sprint Velocity 34, Bugs Open 12,
    Test Coverage 87%).
