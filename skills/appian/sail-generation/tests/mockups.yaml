# =============================================================================
# SAIL Generation Test Suite — Mockup Test Cases
# =============================================================================
#
# Each test case is a user prompt that should be dispatched through the full
# SAIL generation pipeline. The interface name (TEST_*) tells the pipeline to
# create a standalone interface object with no app association.
#
# Fields:
#   id:          Unique test identifier
#   type:        Expected pipeline classification
#   prompt:      The natural-language user request (what gets sent to the agent)
#   covers:      Components/features this test exercises (for coverage tracking)
#
# Prompt styles:
#   - "natural": High-level intent, domain context — agent decides layout
#   - "fields-specified": Lists required fields/data but not how to arrange them
#   - "prescriptive": Specifies exact layout details (for pipeline feature testing)
#
# =============================================================================

# -----------------------------------------------------------------------------
# FORM tests — data entry interfaces
# -----------------------------------------------------------------------------

- id: form-01-employee-onboarding
  type: form
  prompt: >
    Create a standalone interface called TEST_EmployeeOnboarding.
    Build an employee onboarding form. It needs to capture: first name, middle
    initial, last name, email, phone, date of birth, department (one of
    Engineering/Sales/Marketing/HR/Finance), role title, start date, salary,
    whether they'll work remote, preferred office location, and any dietary
    restrictions (vegetarian, vegan, gluten-free, halal, kosher, or none).
    Organize into logical sections.
  covers:
    - form sections (agent chooses grouping)
    - row layout decisions (agent decides what shares rows)
    - text, email, phone, date, dropdown, decimal, toggle, checkbox
    - field type inference from context

- id: form-02-incident-report
  type: form
  prompt: >
    Create a standalone interface called TEST_IncidentReport (no app).
    I need a security incident report form. Someone should be able to record
    what happened (title, severity level, when it occurred, where), describe
    it in detail along with what immediate actions were taken, identify which
    systems were affected and who owns them, note the data classification and
    whether a breach is confirmed, and attach evidence files.
  covers:
    - form with multiple sections (agent decides structure)
    - paragraph fields for descriptions
    - datetime, radio, boolean, fileupload, userpicker
    - natural language → field type mapping

- id: form-03-purchase-request
  type: form
  prompt: >
    Create a standalone interface called TEST_PurchaseRequest (no app).
    A purchase request form for our procurement team. Needs: requestor info
    (name, department, cost center), what they're buying (description,
    quantity, unit price, vendor name and contact), business justification
    with urgency level, and an approval section with manager and budget
    owner sign-off plus a flag for whether VP approval is required.
  covers:
    - form with natural section boundaries
    - number, decimal, email, grouppicker, userpicker
    - toggle for boolean flags
    - agent decides field types from context

# -----------------------------------------------------------------------------
# WIZARD tests — multi-step sequential processes
# -----------------------------------------------------------------------------

- id: wizard-01-new-hire-setup
  type: wizard
  prompt: >
    Create a standalone interface called TEST_NewHireSetup.
    Build a new hire setup wizard that walks through: collecting personal
    details (name, contact info, DOB), configuring their job (department,
    title, manager, start date, employment type), setting up their IT
    equipment (laptop choice between MacBook/ThinkPad/Surface, VPN access,
    which software they need from Slack/Zoom/Figma/Jira/Tableau), and a
    final review step for office location, parking, and any notes.
  covers:
    - multi-step wizard (agent decides step count)
    - cardchoice, toggle, checkbox, userpicker, date
    - step boundary decisions

# -----------------------------------------------------------------------------
# GRID tests — record list / table views
# -----------------------------------------------------------------------------

- id: grid-01-order-management
  type: grid
  prompt: >
    Create a standalone interface called TEST_OrderManagement.
    Build an order management grid with columns: Order ID (primary, NARROW_PLUS),
    Customer (text, MEDIUM), Order Date (text, MEDIUM), Total (text, NARROW_PLUS,
    right-aligned), Status (tag, NARROW_PLUS, with colors: Pending=SECONDARY,
    Processing=ACCENT, Shipped=ACCENT, Delivered=POSITIVE, Cancelled=NEGATIVE).
    Include 6 sample rows with realistic order data. Add a Status filter.
    Primary action button labeled "New Order".
  covers:
    - grid with tag column
    - tagColors mapping (5 statuses)
    - right-aligned column
    - filter derived from tag column
    - primaryActionLabel

- id: grid-02-employee-directory
  type: grid
  prompt: >
    Create a standalone interface called TEST_EmployeeDirectory.
    An employee directory grid. Columns: Name (primary, MEDIUM), Department
    (text, MEDIUM), Title (text, MEDIUM_PLUS), Location (text, NARROW_PLUS),
    Status (tag, NARROW, colors: Active=POSITIVE, On Leave=SECONDARY,
    Terminated=NEGATIVE). 8 sample rows spanning all statuses. Filters for
    Department (choices: Engineering/Sales/Marketing/HR/Finance/Operations)
    and Status. Hero-style header with subtitle "Find and connect with
    colleagues across the organization".
  covers:
    - grid with HERO headerKind
    - multiple filters
    - many sample rows
    - primary column (linked name)

# -----------------------------------------------------------------------------
# DASHBOARD tests — KPIs, charts, metrics overview
# -----------------------------------------------------------------------------

- id: dashboard-01-sales-overview
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_SalesDashboard (no app).
    A sales performance dashboard. I want to see key pipeline metrics at a
    glance (revenue, deals closed, average deal size, win rate), revenue
    trends over the past several months, how revenue breaks down by region,
    pipeline momentum over recent weeks, and a table of our top current deals
    showing company, value, and what stage they're in.
  covers:
    - dashboard with KPIs (agent picks values/icons)
    - chart type selection (agent decides column vs line vs pie)
    - embedded grid
    - layout decisions (what goes side-by-side)

- id: dashboard-02-devops-monitoring
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_DevOpsDashboard (no app).
    A DevOps monitoring dashboard. Should cover: system health (uptime,
    error rate), deployment activity (count, average deploy time), incident
    status (open count, active alerts), response time trends over the past
    several hours, deployment volume by service, incident breakdown by
    severity, and a table of currently active incidents.
  covers:
    - dashboard with many KPIs (agent decides count/grouping)
    - multiple chart types
    - embedded incident grid
    - agent decides layout and section ordering

- id: dashboard-03-hr-metrics
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_HRDashboard.
    Build me an HR dashboard with the following specific KPIs: Headcount
    (1,247, +32 this quarter, users icon), Open Positions (43, 12 urgent,
    briefcase icon), Avg Tenure (3.2 years, up from 2.8, calendar icon),
    Turnover Rate (8.4%, down from 11.2%, chart-line icon). Then show
    headcount broken down by department as a chart, and attrition trends
    over the past 6 months alongside a diversity breakdown.
  covers:
    - dashboard with prescribed KPI values/icons
    - chart type decisions (agent picks bar vs column, etc.)
    - side-by-side layout decisions

# -----------------------------------------------------------------------------
# RECORD-VIEW tests — read-only record detail pages
# -----------------------------------------------------------------------------

- id: record-view-01-employee-profile
  type: record-view
  prompt: >
    Create a standalone interface called TEST_EmployeeProfile (no app).
    An employee profile page for Sarah Chen. She's an active Senior Staff
    Engineer in the Engineering department, started 2019-03-15. Show her
    contact info (email, phone, office, Slack), compensation details (salary
    band L6, equity grant date, last review date), and her certifications
    (AWS Solutions Architect, Kubernetes Administrator, PMP). Status should
    be visually indicated — she could also be On Leave or Terminated.
  covers:
    - record-view with key attributes (agent decides which)
    - tag with status colors (agent decides mapping)
    - multiple sections (agent decides grouping)
    - paragraph vs fields decision

- id: record-view-02-support-ticket
  type: record-view
  prompt: >
    Create a standalone interface called TEST_SupportTicket.
    A support ticket record view for ticket "TKT-2847". Key attributes: Status
    (In Progress, tag with Open=ACCENT/In Progress=SECONDARY/Resolved=POSITIVE/
    Closed=POSITIVE), Priority (High, tag with Critical=NEGATIVE/High=ACCENT/
    Medium=SECONDARY/Low=POSITIVE), Assigned To (James Wilson), Created
    (2024-06-12). Sections: Issue Details with subject line, description
    (paragraph with 2-3 sentences), affected system, browser/OS; Resolution
    with root cause (paragraph), resolution steps (paragraph), time to resolve.
  covers:
    - record-view with 2 tag key attributes (prescriptive)
    - multiple tagColors maps
    - multiple paragraph fields
    - technical domain

- id: record-view-03-case-summary
  type: record-view
  prompt: >
    Create a standalone interface called TEST_CaseSummary (no app).
    A case management record view. The case is "Annual Benefits Enrollment -
    Martinez" opened 2024-08-01. It has a status (Open/In Review/Approved/
    Denied/Closed), a priority, a case type (Benefits/Leave/Compensation/
    Grievance), the assigned HR specialist, the requesting employee, and
    dates for opened, target resolution, and actual resolution. There are
    also notes and a description. Make it clear at a glance what state the
    case is in and who's involved.
  covers:
    - record-view from natural description
    - agent decides key attributes vs section fields
    - agent decides tag colors
    - date fields handling

# -----------------------------------------------------------------------------
# PANE tests — master-detail split panels
# -----------------------------------------------------------------------------

- id: pane-01-email-client
  type: pane
  prompt: >
    Create a standalone interface called TEST_EmailClient.
    An email client pane layout with 3 panes. Left pane (NARROW, dark
    background #1a1a2e): navigation with folders Inbox, Sent, Drafts,
    Trash, Spam, Archive. Middle pane (MEDIUM_PLUS, no background): a grid
    showing emails with columns From (primary, MEDIUM), Subject (text,
    MEDIUM_PLUS), Date (text, NARROW_PLUS). 5 sample email rows. Right pane
    (AUTO, light background #f8f9fa): detail view with fields From, To, Date,
    Subject, and a long message body paragraph. Header subtitle "Manage your
    communications".
  covers:
    - 3-pane layout
    - nav content type
    - grid in middle pane
    - detail in right pane
    - dark + light backgrounds
    - headerSubtitle on pane
