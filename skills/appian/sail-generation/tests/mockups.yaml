- id: dashboard-05-dark-mode-monitoring
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_DarkModeDashboard.
    A dark-mode system monitoring dashboard. Use a dark theme with header
    background #1A1A2E, page background #16213E, card backgrounds #0F3460,
    title text #E0E0E0, subtitle text #A0A0A0, KPI label color #B0B0B0,
    KPI value color #FFFFFF, KPI sub-text color #808080, KPI stamp colors
    cycling through #3B82F6 #10B981 #F59E0B #8B5CF6, and chart accent
    color #3B82F6. KPIs: CPU Usage (72%, 4 cores active, microchip icon),
    Memory (8.2 GB, of 16 GB total, server icon), Network I/O (1.2 Gbps,
    peak today, signal icon), Disk Usage (67%, 340 GB free, database icon).
    Then a line chart "System Load (15 min)" with 6 data points. Then
    side-by-side: a pie chart "Traffic by Service" (API 45%, Web 30%,
    Workers 25%) and a column chart "Errors by Hour" (6 hours).
  covers:
    - custom dark theme via definition JSON
    - theme.headerBg, pageBg, cardBg overrides
    - theme.titleColor, subtitleColor overrides
    - theme.kpiLabelColor, kpiValueColor, kpiSubColor overrides
    - theme.kpiColors array override
    - theme.chartAccent and piePalette usage
    - validates dark-on-dark color contrast in generated SAIL
