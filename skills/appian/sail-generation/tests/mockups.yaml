    (Active Users 12.4K +5%, Conversion Rate 3.2% +0.4pp, Avg Session 4:32
    -12s). Header subtitle: "Real-time analytics dashboard".
  covers:
    - pane with kpis content type
    - nav + kpis combination
    - headerSubtitle

