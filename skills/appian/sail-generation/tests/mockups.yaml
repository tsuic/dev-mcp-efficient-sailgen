- id: record-view-01-employee-profile
  type: record-view
  prompt: >
    Create a standalone interface called TEST_EmployeeProfile.
    An employee profile record view for "Sarah Chen". Key attributes: Status
    (Active, as tag with colors Active=POSITIVE/On Leave=SECONDARY/
    Terminated=NEGATIVE), Department (Engineering), Title (Senior Staff
    Engineer), Start Date (2019-03-15). Sections: Contact Information with
    email, phone, office location, Slack handle; Compensation with salary
    band (L6), equity grant date, last review date; Skills & Certifications
    with a paragraph listing AWS Solutions Architect, Kubernetes Administrator,
    PMP certifications and specializations.
  covers:
    - record-view with keyAttributes (tag + text)
    - multiple sections with mixed field types
    - paragraph in record view
    - tagColors on key attribute

- id: record-view-02-support-ticket
  type: record-view
  prompt: >
    Create a standalone interface called TEST_SupportTicket.
    A support ticket record view for ticket "TKT-2847". Key attributes: Status
    (In Progress, tag with Open=ACCENT/In Progress=SECONDARY/Resolved=POSITIVE/
    Closed=POSITIVE), Priority (High, tag with Critical=NEGATIVE/High=ACCENT/
    Medium=SECONDARY/Low=POSITIVE), Assigned To (James Wilson), Created
    (2024-06-12). Sections: Issue Details with subject line, description
    (paragraph with 2-3 sentences), affected system, browser/OS; Resolution
    with root cause (paragraph), resolution steps (paragraph), time to resolve.
  covers:
    - record-view with 2 tag key attributes
    - multiple tagColors maps
    - multiple paragraph fields
    - technical domain

- id: record-view-03-product-spec
  type: record-view
  prompt: >
    Create a standalone interface called TEST_ProductSpec.
    A product specification record view for "Wireless Noise-Cancelling
    Headphones XR-500". Key attributes: Category (Audio Equipment),
    SKU (XR-500-BLK), Status (In Production, tag with In Production=POSITIVE/
    Prototype=SECONDARY/Discontinued=NEGATIVE/Planning=ACCENT), Launch Date
    (2024-01-15). Sections: Physical Specifications with weight, dimensions,
    color options, material; Technical Specs with driver size, frequency
    response, impedance, battery life, bluetooth version; Pricing with MSRP,
    wholesale cost, margin percentage; Description (paragraph with marketing
    copy).
  covers:
    - record-view with many fields per section
    - 4 sections
    - product/retail domain
    - mix of numeric-looking text values

