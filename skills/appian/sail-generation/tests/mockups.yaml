- id: pane-01-email-client
  type: pane
  prompt: >
    Create a standalone interface called TEST_EmailClient.
    An email client pane layout with 3 panes. Left pane (NARROW, dark
    background #1a1a2e): navigation with folders Inbox, Sent, Drafts,
    Trash, Spam, Archive. Middle pane (MEDIUM_PLUS, no background): a grid
    showing emails with columns From (primary, MEDIUM), Subject (text,
    MEDIUM_PLUS), Date (text, NARROW_PLUS). 5 sample email rows. Right pane
    (AUTO, light background #f8f9fa): detail view with fields From, To, Date,
    Subject, and a long message body paragraph. Header subtitle "Manage your
    communications".
  covers:
    - 3-pane layout
    - nav content type
    - grid in middle pane
    - detail in right pane
    - dark + light backgrounds
    - headerSubtitle on pane

- id: pane-02-project-kanban
  type: pane
  prompt: >
    Create a standalone interface called TEST_ProjectKanban.
    A project management pane with 2 panes. Left pane (NARROW, background
