- id: form-06-all-field-types
  type: form
  prompt: >
    Create a standalone interface called TEST_AllFieldTypes.
    A form demonstrating every field type. Section "Text Inputs": full name
    (text), bio (paragraph), formatted notes (richtext), personal email
    (email type), work phone (phone type), password (encrypted). Section
    "Numbers & Dates": age (number/integer), salary (decimal), birth date
    (date), meeting time (time), interview datetime (datetime). Section
    "Selection": priority (dropdown: Low/Medium/High/Critical), status (radio:
    Active/Inactive/Pending), features (checkbox: WiFi/Bluetooth/GPS/NFC),
    plan tier (card choice bar-stacked template: Free/Pro/Enterprise, single
    select). Section "Special": notifications enabled (toggle), accept terms
    (boolean), point of contact (user picker), review team (group picker),
    supporting docs (file upload).
  covers:
    - ALL field types in one form
    - cardchoice BAR_STACKED template
    - richtext (styledTextEditor)
    - time field
    - comprehensive coverage test

- id: grid-05-all-column-types
  type: grid
  prompt: >
    Create a standalone interface called TEST_AllColumnTypes.
    A grid showcasing every column type. Columns: Task Name (primary,
    MEDIUM_PLUS), Assignee (text, MEDIUM), Status (tag, NARROW_PLUS,
    colors: Done=POSITIVE, In Progress=ACCENT, Blocked=NEGATIVE,
    To Do=SECONDARY), Completion (progressBar, NARROW_PLUS), Photo
    (image, ICON_PLUS), Actions (buttonArray, NARROW_PLUS). 5 sample rows
    with realistic task management data. Filter for Status.
  covers:
    - ALL grid column types (primary, text, tag, progressBar, image, buttonArray)
    - ICON_PLUS width for image column
    - comprehensive grid coverage

- id: dashboard-05-all-chart-types
  type: dashboard
  prompt: >
    Create a standalone interface called TEST_AllChartTypes.
    A dashboard demonstrating every chart type. KPIs section: 3 cards (Total
    Sales $1.2M, Orders 3.4K, Customers 890). Then a columns section with
    a column chart "By Quarter" (Q1-Q4, 2 series) and a line chart "Monthly
    Trend" (6 months, 1 series). Then another columns section with a bar
    chart "By Region" (5 regions) and an area chart "Daily Volume" (7 days).
    Then a pie chart "Market Share" (5 segments). No embedded grid.
  covers:
    - ALL chart types (column, line, bar, area, pie)
    - multi-series chart
    - multiple columns sections
    - standalone pie section
    - 5 distinct chart sections total

- id: layout-09-all-leaves
  type: layout
  prompt: >
    Create a standalone interface called TEST_AllLeaves.
    A layout page (PLAIN_CARD header "Component Showcase", subtitle "Every
    leaf type demonstrated") with body structured as tabs container. Tab
    "Data": columns with a grid leaf (3 columns, 3 rows) and a chart leaf
